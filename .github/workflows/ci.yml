name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        # This will FAIL the build if coverage thresholds are not met
        # Backend API: 80% minimum
        # Frontend: 60% minimum  
        # Critical paths (auth, billing, agents): 90% minimum

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Post coverage summary
        if: always()
        run: |
          echo "=== Coverage Summary ==="
          if [ -f coverage/coverage-summary.json ]; then
            cat coverage/coverage-summary.json | jq '.total' || echo "Could not parse coverage summary"
          else
            echo "Coverage summary not found"
          fi
          echo ""
          echo "Thresholds:"
          echo "  - Backend API routes: 80%"
          echo "  - Frontend components: 60%"
          echo "  - Critical paths (auth, billing, agents): 90%"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  supabase-migrations:
    name: Supabase Migrations Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify migrations are formatted
        run: |
          # Check that migration files follow naming convention
          for file in supabase/migrations/*.sql; do
            if [[ ! "$(basename "$file")" =~ ^[0-9]+_.*\.sql$ ]]; then
              echo "Migration file does not follow naming convention: $file"
              exit 1
            fi
          done
          echo "All migrations follow naming convention"

      - name: Check migration syntax
        run: |
          # Basic SQL syntax validation - check for common issues
          for file in supabase/migrations/*.sql; do
            if grep -q "BEGIN" "$file" && ! grep -q "COMMIT" "$file"; then
              echo "Migration has BEGIN without COMMIT: $file"
              exit 1
            fi
          done
          echo "Migration syntax checks passed"
