name: OpenClaw CTO PR Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  notify-cto:
    name: Notify CTO Agent
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CTO review
        env:
          OPENCLAW_HOOKS_TOKEN: ${{ secrets.OPENCLAW_HOOKS_TOKEN }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          if [ "$PR_ACTION" = "opened" ]; then
            EVENT_TYPE="NEW PR OPENED"
          else
            EVENT_TYPE="PR UPDATED (new commits pushed)"
          fi

          MESSAGE="[GITHUB WEBHOOK — ${EVENT_TYPE}]

          PR #${PR_NUMBER}: ${PR_TITLE}
          Author: ${PR_AUTHOR}
          Branch: ${PR_BRANCH}
          URL: ${PR_URL}

          ACTION REQUIRED: Review this PR per your PR Review Checklist in SOUL.md.

          Steps:
          1. cd ~/code/arm && git fetch origin
          2. git checkout ${PR_BRANCH}
          3. Review code: correctness, type safety, tests, coverage, attribution, security
          4. Run tests: npm run test:coverage
          5. Verify the feature/fix personally
          6. Use gh pr review ${PR_NUMBER} --approve (or --request-changes with comments)
          7. If approved and CI green: gh pr merge ${PR_NUMBER} --squash
          8. Report result to VALIS via sessions_send()"

          curl -sf -X POST "${OPENCLAW_GATEWAY_URL}/hooks/agent" \
            -H "Authorization: Bearer ${OPENCLAW_HOOKS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg message "$MESSAGE" \
              --arg agentId "cto" \
              --arg name "github-pr-review" \
              '{message: $message, agentId: $agentId, name: $name}'
            )"

          echo "CTO agent notified for PR #${PR_NUMBER}"
