name: OpenClaw CTO Issue Triage

on:
  issues:
    types: [opened]

jobs:
  notify-cto:
    name: Notify CTO Agent
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CTO triage
        env:
          OPENCLAW_HOOKS_TOKEN: ${{ secrets.OPENCLAW_HOOKS_TOKEN }}
          OPENCLAW_GATEWAY_URL: ${{ secrets.OPENCLAW_GATEWAY_URL }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          LABELS_JSON: ${{ toJSON(github.event.issue.labels) }}
        run: |
          TRUNCATED_BODY=$(echo "$ISSUE_BODY" | head -c 2000)
          LABELS=$(echo "$LABELS_JSON" | jq -r '.[].name' 2>/dev/null | tr '\n' ', ' | sed 's/,$//')
          LABELS="${LABELS:-none}"

          MESSAGE="[GITHUB WEBHOOK — NEW ISSUE CREATED]

          Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}
          Author: ${ISSUE_AUTHOR}
          Labels: ${LABELS}
          URL: ${ISSUE_URL}

          Body:
          ${TRUNCATED_BODY}

          ACTION REQUIRED: Triage this issue and assign an engineer.

          Steps:
          1. Read the issue details above carefully
          2. Assess scope — which engineer domain does this fall under?
             - Frontend UI/UX → ENG-FE or ENG-UX
             - Backend API/DB → ENG-BE
             - Infrastructure/CI → ENG-INFRA
             - Payments/Stripe → ENG-PAYMENTS
             - AI/Claude integration → ENG-AI
             - Testing/QA → ENG-QA
          3. Add appropriate labels: gh issue edit ${ISSUE_NUMBER} --add-label \"<domain>\" --repo pinkbeambot/pinkbeam-arm
          4. Spawn the assigned engineer via sessions_spawn() with:
             - Clear task description referencing issue #${ISSUE_NUMBER}
             - Branch naming: eng-{role}/task-${ISSUE_NUMBER}-<description>
             - Coverage requirements per SOUL.md thresholds
             - Report format: DONE/BLOCKED with issue number
          5. Update ACTIVE.md with the new assignment
          6. Report assignment to VALIS via sessions_send()"

          curl -sf -X POST "${OPENCLAW_GATEWAY_URL}/hooks/agent" \
            -H "Authorization: Bearer ${OPENCLAW_HOOKS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg message "$MESSAGE" \
              --arg agentId "cto" \
              --arg name "github-issue-triage" \
              '{message: $message, agentId: $agentId, name: $name}'
            )"

          echo "CTO agent notified for Issue #${ISSUE_NUMBER}"
